# Telegraf Configuration for Medusse Project
# MQTT -> InfluxDB Pipeline

[global_tags]
  project = "medusse"
  environment = "development"

[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "10s"
  flush_jitter = "0s"
  precision = ""
  hostname = "medusse-telegraf"
  omit_hostname = false

# MQTT Consumer Input
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = [
    "iescelia/+/temperature",
    "iescelia/+/humidity", 
    "iescelia/+/pressure",
    "iescelia/+/co2",
    "iescelia/+/system"
  ]
  
  # Connection settings
  client_id = "telegraf-medusse"
  username = ""
  password = ""
  
  # Data format
  data_format = "json"
  json_time_key = "timestamp"
  json_time_format = "unix_ms"
  
  # Tags from topic
  topic_tag = "mqtt_topic"
  
  # Parse location from topic path
  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "iescelia/+/+"
    measurement = "_/_/measurement"
    tags = "_/location/_"

# Raw data consumer (complete node data)
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["iescelia/+/raw"]
  
  client_id = "telegraf-medusse-raw"
  data_format = "json"
  json_time_key = "timestamp" 
  json_time_format = "unix_ms"
  
  topic_tag = "mqtt_topic"
  name_override = "node_data"
  
  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "iescelia/+/raw"
    tags = "_/location/_"

# InfluxDB Output
[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "medusse-admin-token-2025"
  organization = "iescelia"
  bucket = "sensors"
  
  # Timeout settings
  timeout = "5s"
  
  # Field type conversions
  [outputs.influxdb_v2.tagpass]
    
# Processor to add additional tags
[[processors.regex]]
  [[processors.regex.tags]]
    key = "mqtt_topic"
    pattern = "^iescelia/([^/]+)/(.+)$"
    replacement = "${1}"
    result_key = "room"
    
  [[processors.regex.tags]]
    key = "mqtt_topic" 
    pattern = "^iescelia/([^/]+)/(.+)$"
    replacement = "${2}"
    result_key = "sensor_type"

# Add timestamp if missing
[[processors.date]]
  field_key = "timestamp"
  date_format = "unix_ms"
  timezone = "UTC"

# Debug output (optional - remove in production)
[[outputs.file]]
  files = ["stdout"]
  data_format = "influx"