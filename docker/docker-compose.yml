version: '3.8'
services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: medusse_mosquitto
    ports:
      - "1883:1883"
      - "9001:9001" # websocket (optional)
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log

  influxdb:
    image: influxdb:2.7
    container_name: medusse_influxdb
    environment:
      - INFLUXDB_ADMIN_USER=admin
      - INFLUXDB_ADMIN_PASSWORD=changeme
      - INFLUXDB_DB=medusse
    ports:
      - "8086:8086"
    volumes:
      - ./influxdb:/var/lib/influxdb2

  grafana:
    image: grafana/grafana:9.0
    container_name: medusse_grafana
    ports:
      - "3000:3000"
    volumes:
      - ./grafana:/var/lib/grafana

# Notes:
# - Create folders mosquitto/, influxdb/, grafana/ as needed.
# - Update passwords and persistence volumes before using in production.
# - Start services with: docker compose up -d (Windows: use PowerShell or cmd with Docker Desktop running)
