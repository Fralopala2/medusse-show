name: Sync 'clase' branch to medusse-show

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Target branch name in the destination repo (defaults to "clase")'
        required: false
        default: 'clase'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch and checkout 'clase'
        run: |
          git fetch origin Clase || git fetch origin clase || true
          # Prefer exact name 'clase' (case-insensitive attempts above)
          if git show-ref --verify --quiet refs/remotes/origin/clase; then
            git checkout -B clase origin/clase
          else
            echo "Branch 'clase' not found in source repository" && exit 1
          fi

      - name: Push to target repository
        env:
          TARGET_REPO_URL: "https://x-access-token:${{ secrets.TARGET_REPO_PAT }}@github.com/Fralopala2/medusse-show.git"
          TARGET_BRANCH: "${{ github.event.inputs.target_branch }}"
        run: |
          if [ -z "$TARGET_BRANCH" ]; then TARGET_BRANCH=clase; fi
          git remote add target "$TARGET_REPO_URL" || true
          git push --force target HEAD:refs/heads/$TARGET_BRANCH

      - name: Done
        run: echo "Branch 'clase' synchronized to Fralopala2/medusse-show (branch: ${{ github.event.inputs.target_branch }})"
